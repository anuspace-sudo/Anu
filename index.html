```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Virtual Aquarium</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      height:100vh;
      background:linear-gradient(to bottom,#04364a,#02131f);
      font-family:Arial,sans-serif;
    }

    .aquarium{
      position:relative;
      width:100%;
      height:100vh;
      overflow:hidden;
    }

    h1{
      position:absolute;
      top:20px;
      width:100%;
      text-align:center;
      color:white;
      font-size:3rem;
      z-index:100;
      text-shadow:0 0 20px rgba(255,255,255,0.5);
    }

    .fish{
      position:absolute;
      left:-250px;
      animation:swim linear infinite;
      filter:drop-shadow(0 0 10px rgba(255,255,255,0.4));
    }

    .fish1{
      top:20%;
      width:180px;
      animation-duration:18s;
    }

    .fish2{
      top:50%;
      width:220px;
      animation-duration:24s;
      animation-delay:5s;
    }

    .fish3{
      top:75%;
      width:150px;
      animation-duration:20s;
      animation-delay:2s;
    }

    @keyframes swim{
      from{
        transform:translateX(0);
      }

      to{
        transform:translateX(130vw);
      }
    }

    .bubble{
      position:absolute;
      bottom:-50px;
      border-radius:50%;
      background:rgba(255,255,255,0.2);
      animation:rise linear infinite;
    }

    @keyframes rise{
      from{
        transform:translateY(0);
        opacity:1;
      }

      to{
        transform:translateY(-120vh);
        opacity:0;
      }
    }

    .light{
      position:absolute;
      width:100%;
      height:100%;
      background:radial-gradient(circle at top,
      rgba(255,255,255,0.1),
      transparent 60%);
      pointer-events:none;
    }
  </style>
</head>

<body>

  <div class="aquarium">

    <h1>🌊 Virtual Aquarium</h1>

    <!-- Fish -->
    <img src="https://pngimg.com/d/fish_PNG25139.png" class="fish fish1">
    <img src="https://pngimg.com/d/fish_PNG25142.png" class="fish fish2">
    <img src="https://pngimg.com/d/fish_PNG25134.png" class="fish fish3">

    <!-- Light Effect -->
    <div class="light"></div>

  </div>

  <script>

    // Create bubbles dynamically
    for(let i=0;i<40;i++){

      let bubble=document.createElement("div");

      bubble.classList.add("bubble");

      let size=Math.random()*20+10;

      bubble.style.width=size+"px";
      bubble.style.height=size+"px";

      bubble.style.left=Math.random()*100+"%";

      bubble.style.animationDuration=
      (Math.random()*10+5)+"s";

      bubble.style.animationDelay=
      Math.random()*5+"s";

      document.querySelector(".aquarium")
      .appendChild(bubble);
    }

  </script>

</body>
</html>
```
