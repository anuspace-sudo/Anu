```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cool Neon Card</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f0f0f;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      position: relative;
      width: 300px;
      padding: 40px;
      border-radius: 20px;
      background: #111;
      color: white;
      text-align: center;
      z-index: 1;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -3px;
      background: linear-gradient(
        45deg,
        #ff00cc,
        #3333ff,
        #00ffee,
        #ff00cc
      );
      background-size: 400%;
      border-radius: 20px;
      z-index: -1;
      animation: glow 8s linear infinite;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 4px;
      background: #111;
      border-radius: 16px;
      z-index: -1;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      background: #00ffee;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #00ffee;
    }

    @keyframes glow {
      0% {
        background-position: 0 0;
      }
      100% {
        background-position: 400% 0;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>⚡ Neon Vibes</h1>
    <p>Pure HTML + CSS glow magic.</p>
    <button onclick="changeText()">Click Me</button>
  </div>

  <script>
    function changeText() {
      document.querySelector("p").innerText =
        "Okay that looked kinda sick 😎";
    }
  </script>

</body>
</html>
```
